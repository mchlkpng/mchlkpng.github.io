<html>
    <head>
        <title>Hanzi/Kanji Practice</title>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-16">
        <header>
            <h1>
                Hanzi/Kanji Practice
            </h1>
        </header>
        <style>
            input.checkbox {
                width:20px;
                height:20px;
                vertical-align: middle;
            }
            div.hanzi {
                border:5px solid grey;
                border-top:10px solid grey;
                border-bottom: 10px solid grey;
            }
            div.hanzi#hanzi-target1 {
                border-left:10px solid grey;
            }
            button.next {
                width:100px;
                height:40px;
                margin:20px;
            }
        </style>
    </head>
    <body>
        <div>
            <h2>
                Input  汉/漢字 for practice (seperate with newline)
            </h2>
            <input type="radio" id="chinese" name="language" value="zh" checked="true">
            <label for="chinese">中文</label>
            <input type="radio" id="japanese" name="language" value="ja">
            <label for="japanese">日本語</label>
            <br><br>
            <textarea id="hanzi-input" rows="7" cols="75" style="resize:none;vertical-align:middle;font-size:20px;"></textarea>
            Randomize &nbsp;<input id="randomize" type="checkbox" class="checkbox">
            <br>
            <br>
            <button onclick="startQuiz()" style="width:100px;height:50px;font-size:20px">Start</button>
        </div>
        <hr>
        <div style="justify-content:center;">
                <br>
                <p id="quiz-index" style="font-size:20px">0.</p>
                <p id="pinyin-text" style="font-size:30px;text-align: center;left:50%;top:20px"></p>
                <div style="display:flex;justify-content:center;align-items:center;">
                    <button class="next" onclick="goBack()">Back</button> &nbsp;
                    <div class="hanzi" id="hanzi-target1"></div>
                    <div class="hanzi" id="hanzi-target2"></div>
                    <div class="hanzi" id="hanzi-target3"></div>
                    <div class="hanzi" id="hanzi-target4"></div>
                    <button class="next" onclick="goForward()">Forward</button>
                </div>
        </div>

        <br>

        <div style="font-size:20px;vertical-align: middle;">
            Show outline&nbsp;<input id="show-outline" class="checkbox"type="checkbox" checked="true" onchange="showOutline(this.checked)"> <br>
            <button onclick="resetWriters()" style="width:100px;height:50px;font-size:20px;">Reset</button>
        </div>
        <div style="width:4px;height:500px;">
            
        </div>
        <script>
            function setCookie(cname, cvalue, exdays) {
                const d = new Date();
                d.setTime(d.getTime() + (exdays*24*60*60*1000));
                let expires = "expires="+ d.toUTCString();
                document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
            }
            function getCookie(cname) {
                let name = cname + "=";
                let decodedCookie = decodeURIComponent(document.cookie);
                let ca = decodedCookie.split(';');
                for(let i = 0; i <ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) == ' ') {
                    c = c.substring(1);
                    }
                    if (c.indexOf(name) == 0) {
                    return c.substring(name.length, c.length);
                    }
                }
                return "";
            }
        </script>
        <script src="./hanzi-writer.js"></script>
        <script src="./pinyin4js.js" type="module"></script>
        <script>
            let writer,writer2,writer3,writer4;
            function showOutline(show) {
                if (!writer) {return}
                if (show) {
                    try {
                        writer.showOutline();
                        writer2.showOutline();
                        writer3.showOutline();
                        writer4.showOutline();
                    } catch(e) {}
                } else {
                    try{
                        writer.hideOutline();
                        writer2.hideOutline();
                        writer3.hideOutline();
                        writer4.hideOutline();
                    } catch (e) {}
                }
            }
            
            function resetWriters() {
                if (!writer) {return}
                makeQuiz(words[quizIndex]);
            }
            function makeQuiz(chars, showCar) {
                
                let settings = {
                    width: 200,
                    height: 200,
                    padding: 0,
                    strokeColor: "#030000"
                }
                let charAr = chars.substring(0, 4).split("");
                let oldchar = chars;
                for (let i = 1; i <= 4; i++) {
                    let el = document.getElementById("hanzi-target"+i);
                    el.innerHTML = "";
                    if (i > charAr.length) {
                        el.style.border = "none";
                    } else {
                        el.style.border = "";
                    }
                    
                }

                if (lang == "zh") {
                    writer = HanziWriter.create("hanzi-target1", charAr[0], settings);
                    writer.quiz();
                    if (charAr[1]) {
                        writer2 = HanziWriter.create("hanzi-target2", charAr[1], settings);
                        writer2.quiz();
                    }
                    if (charAr[2]) {
                        writer3 = HanziWriter.create("hanzi-target3", charAr[2], settings);
                        writer3.quiz();
                    }
                    if (charAr[3]) {
                        writer4 = HanziWriter.create("hanzi-target4", charAr[3], settings);
                        writer4.quiz();
                    }
                document.getElementById("pinyin-text").innerHTML = PinyinHelper.convertToPinyinString(chars, " ", PinyinFormat.WITH_TONE_MARK);
                } else if (lang == "ja") {
                    settings.charDataLoader = function(char, onLoad, onError) {
                        fetch(`./jpdata/${char}.json`)
                        .then(res => res.json())
                        .then(onLoad)
                        .catch(onError);
                    }
                    
                    while (chars.search(/[\u3040-\u309F\u30A0-\u30FF]/g) != -1) {
                        let spot = chars.search(/[\u3040-\u309F\u30A0-\u30FF]/g);
                        chars = chars.substring(0, spot) + chars.substring(spot+1, chars.length);
                    }
                    charAr = chars.substring(0, 4).split("");
                    for (let i = 1; i <= 4; i++) {
                        let el = document.getElementById("hanzi-target"+i);
                        el.innerHTML = "";
                        if (i > charAr.length) {
                            el.style.border = "none";
                        } else {
                            el.style.border = "";
                        }
                        
                    }
                    writer = HanziWriter.create("hanzi-target1", charAr[0], settings);
                    writer.quiz();
                    if (charAr[1]) {
                        writer2 = HanziWriter.create("hanzi-target2", charAr[1], settings);
                        writer2.quiz();
                    }
                    if (charAr[2]) {
                        writer3 = HanziWriter.create("hanzi-target3", charAr[2], settings);
                        writer3.quiz();
                    }
                    if (charAr[3]) {
                        writer4 = HanziWriter.create("hanzi-target4", charAr[3], settings);
                        writer4.quiz();
                    }
                    
                    document.getElementById("pinyin-text").innerHTML = toHira[oldchar];
                }
                showOutline(document.getElementById("show-outline").checked)
                document.getElementById("hanzi-target"+charAr.length).style.borderRight = "10px solid grey";
            }
        </script>

        <script>
            let toHira
            let quizIndex = 1;
            let words;
            let emcook = getCookie("words");
            let lang = getCookie("language");
            document.getElementById("hanzi-input").value = emcook.split(",").join("\n");
            let langrads = document.getElementsByName("language");
            for (let i = 0; i < langrads.length; i++) {
                if (lang == langrads[i].value) {
                    langrads[i].checked = true;
                } else {
                    langrads[i].checked = false;
                }
            }
            if (lang != "zh" && lang != "ja") {langrads[0].checked = true;}
            function startQuiz() {
                let h = document.getElementById("hanzi-input").value;
                quizIndex = 0;

                if (langrads[0].checked) {
                    lang = langrads[0].value;
                } else {
                    lang = langrads[1].value;
                }


                setCookie("words", h.split(/\s/).join(","), 500);
                setCookie("language", lang);

                words = h.split(/\s/);
                if (document.getElementById("randomize").checked) {
                    let rwords = [];
                    for(let i = 0; i < words.length + rwords.length; i++) {
                        let index = Math.floor(Math.random()*words.length);
                        let el = words[index];
                        rwords.push(el);
                        words.splice(index, 1);
                    }
                    words = rwords;
                }
                makeQuiz(words[quizIndex]);
                displayQuizIndex();
            }

            function goBack() {
                if (quizIndex > 0) {
                    quizIndex--;
                    displayQuizIndex();
                    makeQuiz(words[quizIndex]);
                }
            }
            function goForward() {
                if (quizIndex < words.length-1) {
                    quizIndex++;
                    displayQuizIndex();
                    makeQuiz(words[quizIndex]);
                }
            }
            function displayQuizIndex() {
                document.getElementById("quiz-index").innerHTML = (quizIndex+1) + "."
            }
            fetch("./kanjToHira.json")
            .then(res => res.json())
            .then(data => {
                toHira = data;
            })
        </script>


    </body>
</html>
